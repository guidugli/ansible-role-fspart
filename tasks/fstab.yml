---
- name: Track mount point used by handlers
  ansible.builtin.set_fact:
    fspart_mount_point: "{{ item.name }}"
  tags:
    - fspart
    - validate
    - facts

- name: Query existing fstab entry
  ansible.builtin.command:
    argv:
      - findmnt
      - --fstab
      - --target
      - "{{ item.name }}"
      - --output
      - SOURCE,FSTYPE,OPTIONS
      - --noheadings
      - --raw
  register: fspart_fstab_entry
  changed_when: false
  failed_when: false
  tags:
    - fspart
    - facts
    - validate

- name: Validate required creation inputs for new fstab entries
  ansible.builtin.assert:
    quiet: true
    that:
      - item.src | default('') | string | trim | length > 0
      - item.fstype | default('') in fspart_allowed_fstype
    fail_msg: >-
      Partition {{ item.name }} is configured with autofix via fstab but no existing
      fstab entry was found and src/fstype were not fully provided.
  when: fspart_fstab_entry.rc != 0
  tags:
    - fspart
    - validate

- name: Create or update fstab entry when no existing entry is present
  ansible.posix.mount:
    path: "{{ item.name }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.mount_options | join(',') }}"
    state: "{{ item.mount_state | default('mounted') }}"
  when: fspart_fstab_entry.rc != 0
  tags:
    - fspart
    - config
    - service

- name: Build parsed values from the existing fstab entry
  ansible.builtin.set_fact:
    fspart_fstab_fields: "{{ fspart_fstab_entry.stdout.split() }}"
  when: fspart_fstab_entry.rc == 0
  tags:
    - fspart
    - validate
    - facts

- name: Update mount options for an existing fstab entry
  ansible.posix.mount:
    path: "{{ item.name }}"
    src: "{{ fspart_fstab_fields[0] }}"
    fstype: "{{ fspart_fstab_fields[1] }}"
    opts: "{{ item.mount_options | join(',') }}"
    state: "{{ item.mount_state | default('mounted') }}"
  when: fspart_fstab_entry.rc == 0
  tags:
    - fspart
    - config
    - service
