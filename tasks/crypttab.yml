---
- name: Ensure crypt key directory exists
  ansible.builtin.file:
    path: "{{ fspart_cryptkeys_path }}"
    owner: root
    group: root
    mode: '0700'
    state: directory
  when: fspart_cryptkeys_files | length > 0
  tags:
    - config

- name: Copy crypt key files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ fspart_cryptkeys_path }}/{{ item.name }}"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ fspart_cryptkeys_files }}"
  loop_control:
    label: "{{ item.name }}"
  when: fspart_cryptkeys_files | length > 0
  tags:
    - config

- name: Manage crypttab entries
  community.general.crypttab:
    name: "{{ item.name }}"
    backing_device: "{{ item.backing_device | default(omit) }}"
    password: "{{ item.password | default(omit) }}"
    opts: "{{ item.opts | default(omit) }}"
    state: present
  loop: "{{ fspart_crypttab_entries }}"
  loop_control:
    label: "{{ item.name }}"
  when: fspart_crypttab_entries | length > 0
  tags:
    - config

- name: Start systemd cryptsetup units for non-none password entries
  ansible.builtin.systemd:
    name: "systemd-cryptsetup@{{ item.name | replace('-', '\x2d') }}"
    state: started
    daemon_reload: true
  loop: "{{ fspart_crypttab_entries }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (ansible_facts["service_mgr"] | default('')) == 'systemd'
    - fspart_crypttab_entries | length > 0
    - item.password | default('') != 'none'
  tags:
    - service
