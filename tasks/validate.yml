---
- name: Validate configured partitions with findmnt
  vars:
    option_args: "{{ ['-O', item.validate_options | join(',')]
      if (item.validate_options | default([]) | length > 0) else [] }}"
  ansible.builtin.command:
    argv: "{{ ['findmnt'] + option_args + [item.name] }}"
  register: fspart_partition_validation
  changed_when: false
  failed_when: fspart_partition_validation.rc != 0
  loop: "{{ partitions }}"
  when: item.validate_options | default([]) | length > 0
  loop_control:
    label: >-
      Partition {{ item.name }} with options {{ item.validate_options | default([]) | join(',') }}
  tags:
    - fspart
    - validate
