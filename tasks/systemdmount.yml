---
- name: Track unit and mount point used by handlers
  ansible.builtin.set_fact:
    fspart_unit_notify: "{{ item.unit_name }}"
    fspart_mount_point: "{{ item.name }}"
  tags:
    - facts

- name: Check known remote systemd unit paths
  ansible.builtin.stat:
    path: "{{ fileitem }}"
  register: fspart_unit_location
  loop:
    - "{{ fspart_systemd_etc_path }}/{{ item.unit_name }}"
    - /usr/lib/systemd/system/{{ item.unit_name }}
    - "{{ fspart_systemd_lib_path }}/{{ item.unit_name }}"
    - "{{ fspart_systemd_share_path }}/{{ item.unit_name }}"
  loop_control:
    loop_var: fileitem
    label: "{{ fileitem }}"
  tags:
    - facts

- name: Store detected remote unit path information
  vars:
    fspart_detected_unit_paths: >-
      {{
        fspart_unit_location.results
        | selectattr('stat.exists', 'equalto', true)
        | map(attribute='fileitem')
        | list
      }}
  ansible.builtin.set_fact:
    fspart_systemd_unit_path: "{{ fspart_detected_unit_paths | first | default('') }}"
    fspart_systemd_unit_found: "{{ fspart_detected_unit_paths | length > 0 }}"
  tags:
    - facts

- name: Check whether controller unit file exists
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ item.unit_name }}"
  delegate_to: localhost
  become: false
  register: fspart_controller_unit_file
  tags:
    - facts

- name: Show detected mount unit source
  ansible.builtin.debug:
    msg:
      - "Unit: {{ item.unit_name }}"
      - "Remote source: {{ fspart_systemd_unit_path | default('not found', true) }}"
      - "Controller source exists: {{ fspart_controller_unit_file.stat.exists }}"
  tags:
    - debug

- name: Copy mount unit into /etc/systemd/system when needed
  when: fspart_systemd_unit_path != (fspart_systemd_etc_path ~ '/' ~ item.unit_name)
  block:
    - name: Copy mount unit from remote systemd location when available
      ansible.builtin.copy:
        src: "{{ fspart_systemd_unit_path }}"
        dest: "{{ fspart_systemd_etc_path }}/{{ item.unit_name }}"
        force: false
        owner: root
        group: root
        mode: '0644'
        remote_src: true
      when: fspart_systemd_unit_found
      notify: Reload systemd configuration
      tags:
        - config

    - name: Copy mount unit from controller when no remote source exists
      ansible.builtin.copy:
        src: "{{ fspart_controller_unit_file.stat.path }}"
        dest: "{{ fspart_systemd_etc_path }}/{{ item.unit_name }}"
        force: false
        owner: root
        group: root
        mode: '0644'
      when:
        - not fspart_systemd_unit_found
        - fspart_controller_unit_file.stat.exists
      notify: Reload systemd configuration
      tags:
        - config

    - name: Fail when the mount unit was not found locally or remotely
      ansible.builtin.fail:
        msg: >-
          Unit {{ item.unit_name }} was not found on the controller under
          {{ role_path }}/files or in the known remote systemd unit locations.
      when:
        - not fspart_systemd_unit_found
        - not fspart_controller_unit_file.stat.exists
      tags:
        - validate

- name: Ensure the mount unit has an Install section
  community.general.ini_file:
    path: "{{ fspart_systemd_etc_path }}/{{ item.unit_name }}"
    section: Install
    option: WantedBy
    value: local-fs.target
    no_extra_spaces: true
    mode: '0644'
  notify:
    - Reload systemd configuration
    - Restart systemd unit
    - Reboot
  tags:
    - config

- name: Ensure configured mount options are present in the mount unit
  ansible.builtin.lineinfile:
    path: "{{ fspart_systemd_etc_path }}/{{ item.unit_name }}"
    regexp: '^Options='
    line: "Options={{ item.mount_options | join(',') }}"
    state: present
  notify:
    - Reload systemd configuration
    - Restart systemd unit
    - Reboot
  tags:
    - config

- name: Flush handlers after mount unit changes
  ansible.builtin.meta: flush_handlers
  tags:
    - service
