---
- name: Review and optionally fix /var/log permissions
  tags:
    - fspart
    - validate
    - config
    - debug
  block:
    - name: Find /var/log entries with overly permissive modes
      ansible.builtin.command: >-
        find /var/log
        \( -type f -perm /g=xw,o=rwx -o -type d -perm /g=w,o=wx \)
        -print
      register: fspart_log_scan
      changed_when: false
      tags:
        - fspart
        - validate

    - name: Build filtered /var/log results
      ansible.builtin.set_fact:
        fspart_log_scan_filtered: "{{ fspart_log_scan.stdout_lines }}"
      tags:
        - fspart
        - validate
        - facts

    - name: Exclude configured /var/log exceptions
      ansible.builtin.set_fact:
        fspart_log_scan_filtered: >-
          {{ fspart_log_scan_filtered | reject('match', item) | list }}
      loop: "{{ fspart_log_exception }}"
      loop_control:
        label: "{{ item }}"
      when: fspart_log_exception | length > 0
      tags:
        - fspart
        - validate
        - facts

    - name: Show /var/log entries selected for remediation
      ansible.builtin.debug:
        msg:
          - '------- FILES THAT WILL BE FIXED -------'
          - "{{ fspart_log_scan_filtered }}"
          - '----------------------------------------'
      tags:
        - fspart
        - validate
        - debug

    - name: Tighten /var/log permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'o-rwx,g-w'
      loop: "{{ fspart_log_scan_filtered }}"
      loop_control:
        label: "{{ item }}"
      when:
        - fs_log_files_fix_enabled
        - fspart_log_scan_filtered | length > 0
      tags:
        - fspart
        - config

- name: Review and optionally fix world-writable files
  tags:
    - fspart
    - validate
    - config
    - debug
  block:
    - name: Search for world-writable files on local filesystems
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | grep -v '/run/user' | grep -v '/tmp' | grep -v '/dev' |
        awk 'NR != 1 { print $6 }' |
        xargs -I '{}' find '{}' -xdev -type f -perm -0002
      args:
        executable: /bin/bash
      register: fspart_world_writable_scan
      changed_when: false
      tags:
        - fspart
        - validate

    - name: Build filtered world-writable results
      ansible.builtin.set_fact:
        fspart_world_writable_filtered: "{{ fspart_world_writable_scan.stdout_lines }}"
      tags:
        - fspart
        - validate
        - facts

    - name: Exclude configured world-writable exceptions
      ansible.builtin.set_fact:
        fspart_world_writable_filtered: >-
          {{ fspart_world_writable_filtered | reject('match', item) | list }}
      loop: "{{ fs_world_writeable_excludes }}"
      loop_control:
        label: "{{ item }}"
      when: fs_world_writeable_excludes | length > 0
      tags:
        - fspart
        - validate
        - facts

    - name: Show world-writable entries selected for remediation
      ansible.builtin.debug:
        msg:
          - '------- FILES THAT CAN BE FIXED -------'
          - "{{ fspart_world_writable_filtered }}"
          - '---------------------------------------'
      tags:
        - fspart
        - validate
        - debug

    - name: Remove world-write permission from selected files
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'o-w'
      loop: "{{ fspart_world_writable_filtered }}"
      loop_control:
        label: "{{ item }}"
      when:
        - fs_world_writeable_fix_enabled
        - fspart_world_writable_filtered | length > 0
      tags:
        - fspart
        - config

- name: Detect unowned files
  tags:
    - fspart
    - validate
    - debug
  block:
    - name: Scan for unowned files
      ansible.builtin.shell: |
        set -o pipefail
        /usr/bin/df --local -P | grep -v '/run/user' |
        /usr/bin/awk 'NR != 1 { print $6 }' | grep -v '/dev' | grep -v '/sys' |
        /usr/bin/xargs -I '{}' find '{}' -xdev -nouser |
        grep -v overlay | grep -v '/dev' | grep -v '/sys' | grep -v '/proc' |
        grep -v '/opt/var/lib/containers' | grep -v '.local/share/containers'
      args:
        executable: /bin/bash
      register: fspart_unowned_scan
      changed_when: false
      failed_when: false
      tags:
        - fspart
        - validate

    - name: Show unowned files when detected
      ansible.builtin.debug:
        msg:
          - '------- UNOWNED FILES FOUND -------'
          - "{{ fspart_unowned_scan.stdout_lines }}"
          - '-----------------------------------'
      changed_when: false
      failed_when: false
      when: fspart_unowned_scan.stdout | length > 0
      tags:
        - fspart
        - validate
        - debug

    - name: Fail when unowned files are detected and strict mode is enabled
      ansible.builtin.fail:
        msg: Unowned files found.
      when:
        - fs_unowned_detection_enabled
        - fspart_unowned_scan.stdout | length > 0
      tags:
        - fspart
        - validate

- name: Detect ungrouped files
  vars:
    fspart_is_container: >-
      {{
        ansible_facts['virtualization_type'] | default('')
        in ['docker', 'lxc', 'containerd', 'container']
      }}
  tags:
    - fspart
    - validate
    - debug
  block:
    - name: Scan for ungrouped files
      ansible.builtin.shell: |
        set -o pipefail
        /usr/bin/df --local -P | grep -v '/run/user' |
        /usr/bin/awk 'NR != 1 { print $6 }' | grep -v '/dev' | grep -v '/sys' |
        {{ 'grep -vE ^/dev$ |' if fspart_is_container else '' }}
        /usr/bin/xargs -I '{}' find '{}' -xdev -nogroup |
        grep -v overlay | grep -v '/dev' | grep -v '/sys' | grep -v '/proc'
      args:
        executable: /bin/bash
      register: fspart_ungrouped_scan
      changed_when: false
      failed_when: false
      tags:
        - fspart
        - validate

    - name: Show ungrouped files when detected
      ansible.builtin.debug:
        msg:
          - '------- UNGROUPED FILES FOUND -------'
          - "{{ fspart_ungrouped_scan.stdout_lines }}"
          - '-------------------------------------'
      changed_when: false
      failed_when: false
      when: fspart_ungrouped_scan.stdout | length > 0
      tags:
        - fspart
        - validate
        - debug

    - name: Fail when ungrouped files are detected and strict mode is enabled
      ansible.builtin.fail:
        msg: Ungrouped files found.
      when:
        - fs_ungrouped_detection_enabled
        - fspart_ungrouped_scan.stdout | length > 0
      tags:
        - fspart
        - validate

- name: List SUID files for review
  tags:
    - fspart
    - validate
    - debug
  block:
    - name: Scan for SUID files
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | grep -v '/run/user' | awk 'NR != 1 { print $6 }' |
        xargs -I '{}' find '{}' -xdev -type f -perm -4000 2>/dev/null
      args:
        executable: /bin/bash
      register: fspart_suid_scan
      changed_when: false
      failed_when: false
      tags:
        - fspart
        - validate

    - name: Show SUID files when detected
      ansible.builtin.debug:
        msg:
          - '------- SUID FILES FOUND -------'
          - "{{ fspart_suid_scan.stdout_lines }}"
          - '--------------------------------'
      changed_when: false
      failed_when: false
      when: fspart_suid_scan.stdout | length > 0
      tags:
        - fspart
        - validate
        - debug

