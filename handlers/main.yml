---
- name: Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart systemd unit
  ansible.builtin.systemd:
    name: "{{ fspart_unit_notify }}"
    enabled: true
    state: restarted
  when: fspart_unit_notify != 'tmp.mount'
  ignore_errors: true  # noqa ignore-errors

- name: Remount filesystem
  ansible.posix.mount:
    path: "{{ fspart_mount_point }}"
    state: remounted
  ignore_errors: true  # noqa ignore-errors

- name: Reboot
  ansible.builtin.reboot:
    msg: Reboot initiated by Ansible after filesystem configuration changes.
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when:
    - fspart_allow_reboot | bool
    - ansible_connection != 'docker'
