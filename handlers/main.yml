---
- name: Reload systemd configuration
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - fspart
    - service

- name: Restart systemd unit
  ansible.builtin.systemd_service:
    name: "{{ fspart_unit_notify }}"
    enabled: true
    state: restarted
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - fspart_unit_notify != 'tmp.mount'
  failed_when: false
  tags:
    - fspart
    - service

- name: Remount filesystem
  ansible.posix.mount:
    path: "{{ fspart_mount_point }}"
    state: remounted
  failed_when: false
  tags:
    - fspart
    - service

- name: Reboot
  ansible.builtin.reboot:
    msg: Reboot initiated by Ansible after filesystem configuration changes.
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when:
    - fspart_allow_reboot | bool
    - ansible_connection not in ['docker', 'containers.podman.podman']
  tags:
    - fspart
    - service
